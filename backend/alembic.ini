[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Keep this file ASCII-only: configparser reads it with the system locale
# encoding (GBK on zh-CN Windows) and non-ASCII bytes make Alembic crash.
# One project.db per project, so no hardcoded URL here.
# Usage: alembic -x db=<project_dir>/project.db upgrade head
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
