[project]
name = "aivs-backend"
version = "0.1.0"
description = "AI Video Studio backend — 视频工程与编排器"
# 许可全文在仓库根的 LICENSE（这里不写 license-files：那是 setuptools>=77 才认的
# PEP 639 字段，且不接受 `..` 跑到 backend/ 外面去）。
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "httpx>=0.27.0",
  "websockets>=13.0",
  "structlog>=24.4.0",
  "python-ulid>=3.0.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
