[package]
name = "aivs-desktop"
version = "0.1.0"
description = "AI Video Studio 桌面壳（托管 Python 后端 sidecar）"
license = "MIT"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
