server {
    listen 80;
    server_name _;

    client_max_body_size 10G;

    # 文本类资源压缩传输（JS / CSS / JSON 体积能小到三分之一）。视频本身已压缩，不再压。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态托管
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 构建产物文件名带内容哈希，可以长期缓存；index.html 不缓存，保证发版后立刻拿到新入口。
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # API 接口反向代理到本地 FastAPI 后端
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        # 媒体走 Range 边下边播：不让 nginx 把整段响应先灌进磁盘临时文件。
        # 默认会把 bytes=0- 的整个视频（最多 1G）拉进临时文件，拖动 / 换段一次就白写一遍盘，
        # 后端也被迫读完整个文件；关掉后只按客户端的消费速度从后端取。
        proxy_max_temp_file_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 300s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # WebSocket 反向代理
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
