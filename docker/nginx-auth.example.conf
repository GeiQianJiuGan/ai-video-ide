# 宿主机反向代理示例；先配置证书和 /etc/nginx/aivs.htpasswd，再启用。
# auth_basic 放在 server 级别，静态页面、REST API 与 WebSocket 共用认证。
server {
    listen 443 ssl;
    server_name video.example.com;

    ssl_certificate /etc/letsencrypt/live/video.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.example.com/privkey.pem;

    auth_basic "AI Video Studio";
    auth_basic_user_file /etc/nginx/aivs.htpasswd;

    client_max_body_size 500M;
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
