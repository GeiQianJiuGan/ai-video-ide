# 宿主机 TLS 反向代理示例；认证由平台内置 Key / HttpOnly 会话负责。
# 后端必须 AIVS_ACCESS_MODE=server，AIVS_ALLOWED_ORIGINS=["https://video.example.com"]。
# 不叠加 Basic Auth：它会占用外部 AI 的 Authorization: Bearer 请求头。
server {
    listen 443 ssl;
    server_name video.example.com;

    ssl_certificate /etc/letsencrypt/live/video.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.example.com/privkey.pem;

    client_max_body_size 500M;
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
    }
}
