name: 代码检查

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装后端开发依赖
        run: python -m pip install -e "./backend[dev]"
      - name: 后端静态检查
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: 后端测试
        working-directory: backend
        run: python -m pytest -q
      - name: 开放接口文档一致性
        run: python scripts/export_open_api.py --check
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      - name: 前端检查与构建
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Docker 部署配置检查
        run: docker compose config --quiet
