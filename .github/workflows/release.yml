name: 出安装包

# Tauri 的壳是原生程序，**没法交叉编译**：Windows 的 .exe 安装器只能在 Windows 上出，
# Linux 的 AppImage / deb / rpm 只能在 Linux 上出。所以这里不是一个作业跑两遍，
# 而是两台机器各跑一次同一份 scripts/build_desktop.py。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: 打完只上传产物，不建 Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            targets: nsis
          # 22.04 而不是 latest：AppImage 的 glibc 与 WebKitGTK 版本跟着构建机走，
          # 在越老的系统上打包，产物能跑的发行版就越多。
          - os: ubuntu-22.04
            label: linux
            targets: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 依赖（WebKitGTK 与 rpmbuild）
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri

      - name: 装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 装后端依赖（含 PyInstaller）
        # sidecar 要在这套依赖里冻结，所以 package 这个 extra 必须装上。
        run: python -m pip install -e "./backend[package]"

      - name: 出包
        # 图标 → FFmpeg → sidecar（含启动自检）→ cargo tauri build，顺序在脚本里。
        run: python scripts/build_desktop.py --targets ${{ matrix.targets }}

      - uses: actions/upload-artifact@v4
        with:
          name: aivs-${{ matrix.label }}
          # 只收安装包本身，不收 bundle 目录里那些解包出来的中间物。
          path: |
            tauri/target/release/bundle/nsis/*.exe
            tauri/target/release/bundle/appimage/*.AppImage
            tauri/target/release/bundle/deb/*.deb
            tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    # 只有推 tag 才建 Release；手动触发时产物留在 Actions 的 artifacts 里。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            装完双击就能用：Python 解释器与 FFmpeg 都在包里。

            - Windows：`.exe`（NSIS，当前用户安装，不需要管理员）
            - Linux：`.AppImage`（`chmod +x` 后直接跑）/ `.deb` / `.rpm`

            首次启动会在用户数据目录下建 `runtime/`；ComfyUI 与 LLM 没配置时，
            手动流程（导入素材 → 分镜 → 时间线 → 导出）完全可用。
