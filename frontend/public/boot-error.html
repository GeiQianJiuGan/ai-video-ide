<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI Video Studio — 启动失败</title>
    <style>
      :root {
        color-scheme: dark;
        --base-0: #0b0d10;
        --base-1: #12151a;
        --line-1: #23272e;
        --fg-1: #e6e8eb;
        --fg-3: #8b949e;
        --failed: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 28px 32px;
        background: var(--base-0);
        color: var(--fg-1);
        font:
          13px/1.6 ui-sans-serif,
          system-ui,
          'Segoe UI',
          sans-serif;
        user-select: text;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        color: var(--failed);
      }
      .code {
        font:
          11px/1.4 ui-monospace,
          Consolas,
          monospace;
        color: var(--fg-3);
        letter-spacing: 0.04em;
      }
      .panel {
        margin-top: 20px;
        border: 1px solid var(--line-1);
        border-radius: 6px;
        background: var(--base-1);
        padding: 14px 16px;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12px/1.6 ui-monospace,
          Consolas,
          monospace;
      }
      ol {
        margin: 0;
        padding-left: 20px;
      }
      li + li {
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1 id="title">启动失败</h1>
    <div class="code" id="code"></div>

    <div class="panel">
      <h2>原因</h2>
      <pre id="detail"></pre>
    </div>

    <div class="panel" id="suggestions-panel" hidden>
      <h2>怎么修</h2>
      <ol id="suggestions"></ol>
    </div>

    <!-- 外链脚本而非内联：CSP 的 script-src 只允许 'self'。 -->
    <script src="./boot-error.js"></script>
  </body>
</html>
